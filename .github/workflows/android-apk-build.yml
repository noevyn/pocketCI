name: Build PocketCI Android app

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-apk-build.yml"
      - "scripts/apply-pocketci-branding.mjs"
      - "upstream/DroidRunner"
      - "upstream/DroidRunner/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - ".github/workflows/android-apk-build.yml"
      - "scripts/apply-pocketci-branding.mjs"
      - "upstream/DroidRunner"
      - "upstream/DroidRunner/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketci-android-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and PocketCI debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out PocketCI and pinned DroidRunner source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle wrapper and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('upstream/DroidRunner/gradle/wrapper/gradle-wrapper.properties', 'upstream/DroidRunner/**/*.gradle*', 'upstream/DroidRunner/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Apply PocketCI identity and branding overlay
        run: node scripts/apply-pocketci-branding.mjs

      - name: Build PRoot native libraries
        working-directory: upstream/DroidRunner
        run: |
          cat > "$RUNNER_TEMP/wgetrc" <<'EOF'
          timeout = 25
          tries = 1
          waitretry = 0
          dns_timeout = 10
          read_timeout = 25
          EOF
          timeout 10m env \
            WGETRC="$RUNNER_TEMP/wgetrc" \
            ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" \
            runtime/build-proot.sh

      - name: Verify Kotlin Compose plugin repositories
        shell: bash
        run: |
          set -euo pipefail
          artifact="org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin/2.4.10/org.jetbrains.kotlin.plugin.compose.gradle.plugin-2.4.10.pom"
          for base in "https://plugins.gradle.org/m2" "https://repo.maven.apache.org/maven2"; do
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 "$base/$artifact" -o /dev/null; then
              echo "Kotlin Compose plugin marker reachable from $base"
              exit 0
            fi
          done
          echo "::error::Kotlin Compose plugin marker is unreachable from both configured repositories"
          exit 1

      - name: Run unit tests and assemble PocketCI debug APK
        working-directory: upstream/DroidRunner
        env:
          POCKETCI_GITHUB_APP_CLIENT_ID: ${{ vars.POCKETCI_GITHUB_APP_CLIENT_ID }}
          POCKETCI_GITHUB_APP_SLUG: ${{ vars.POCKETCI_GITHUB_APP_SLUG }}
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=30000 -Dorg.gradle.internal.http.socketTimeout=30000"
        run: |
          set -o pipefail
          gradle_args=(
            "-Ppocketci.githubAppClientId=$POCKETCI_GITHUB_APP_CLIENT_ID"
            "-Ppocketci.githubAppSlug=$POCKETCI_GITHUB_APP_SLUG"
            "-Ppocketci.sourceUrl=https://github.com/noevyn/pocketCI"
            "-Ppocketci.sourceCommit=$GITHUB_SHA"
          )
          log_file="$RUNNER_TEMP/pocketci-gradle-build.log"
          if timeout 15m ./gradlew --no-daemon --stacktrace "${gradle_args[@]}" testDebugUnitTest assembleDebug 2>&1 | tee "$log_file"; then
            exit 0
          fi
          if grep -q "Plugin .* was not found" "$log_file"; then
            echo "A Gradle plugin could not be resolved; retrying once with refreshed dependency metadata."
            timeout 15m ./gradlew --no-daemon --refresh-dependencies --stacktrace "${gradle_args[@]}" testDebugUnitTest assembleDebug
          else
            exit 1
          fi

      - name: Verify PocketCI APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk="upstream/DroidRunner/app/build/outputs/apk/debug/app-debug.apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          badging="$("$aapt" dump badging "$apk")"
          printf '%s\\n' "$badging" | grep -F "package: name='com.noevyn.pocketci'"
          printf '%s\\n' "$badging" | grep -F "application-label:'PocketCI'"

      - name: Upload Gradle diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pocketci-gradle-failure-log
          path: ${{ runner.temp }}/pocketci-gradle-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload PocketCI debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pocketci-debug-apk
          path: upstream/DroidRunner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
