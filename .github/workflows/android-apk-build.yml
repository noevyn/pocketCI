name: Build PocketCI Android app

on:
  push:
    branches:
      - pocketci/implementation-plan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketci-android-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and PocketCI debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out PocketCI and pinned DroidRunner source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply PocketCI identity and branding overlay
        run: node scripts/apply-pocketci-branding.mjs

      - name: Build PRoot native libraries
        working-directory: upstream/DroidRunner
        run: |
          cat > "$RUNNER_TEMP/wgetrc" <<'EOF'
          timeout = 25
          tries = 1
          waitretry = 0
          dns_timeout = 10
          read_timeout = 25
          EOF
          timeout 10m env \
            WGETRC="$RUNNER_TEMP/wgetrc" \
            ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" \
            runtime/build-proot.sh

      - name: Run unit tests and assemble PocketCI debug APK
        working-directory: upstream/DroidRunner
        env:
          POCKETCI_GITHUB_APP_CLIENT_ID: ${{ vars.POCKETCI_GITHUB_APP_CLIENT_ID }}
          POCKETCI_GITHUB_APP_SLUG: ${{ vars.POCKETCI_GITHUB_APP_SLUG }}
        run: |
          set -o pipefail
          gradle_args=(
            "-Ppocketci.githubAppClientId=$POCKETCI_GITHUB_APP_CLIENT_ID"
            "-Ppocketci.githubAppSlug=$POCKETCI_GITHUB_APP_SLUG"
            "-Ppocketci.sourceUrl=https://github.com/noevyn/pocketCI"
            "-Ppocketci.sourceCommit=$GITHUB_SHA"
          )
          log_file="$RUNNER_TEMP/pocketci-gradle-build.log"
          if ./gradlew --no-daemon --stacktrace "${gradle_args[@]}" testDebugUnitTest assembleDebug 2>&1 | tee "$log_file"; then
            exit 0
          fi
          if grep -q "Plugin .* was not found" "$log_file"; then
            echo "A Gradle plugin could not be resolved; retrying once with refreshed dependency metadata."
            ./gradlew --no-daemon --refresh-dependencies --stacktrace "${gradle_args[@]}" testDebugUnitTest assembleDebug
          else
            exit 1
          fi

      - name: Upload PocketCI debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pocketci-debug-apk
          path: upstream/DroidRunner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
